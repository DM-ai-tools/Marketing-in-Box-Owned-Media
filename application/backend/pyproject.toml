[project]
name = "marketing-in-a-box-backend"
version = "0.1.0"
description = "Marketing-in-a-Box orchestrator API: DAG pipeline, Claude-based generation, HITL review."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # [asyncio] extra pulls in greenlet, which app/db/base.py's async engine requires at import
    # time — alembic's env.py imports that engine too, so a pre-deploy `alembic upgrade` needs it
    # just as much as the running app does. Missing it fails with
    # "ModuleNotFoundError: No module named greenlet" the moment alembic (or anything else) imports
    # app.db.base, not on first async query — confirmed on a Railway pre-deploy migration run.
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "celery>=5.4",
    "redis>=5.0",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "networkx>=3.3",
    # Runtime, not just test tooling: app/services/scraper.py fetches the live page behind the
    # CRO stage's "Existing Page URL" so the operator does not have to paste it by hand.
    "httpx>=0.27",
    # Context.dev: one key for scraping, web search, and brand intelligence.
    # Every call goes through app/services/context_dev.py.
    "context.dev>=2.14",
    # The webinar stage's Step 5 slide brief, written out as a real .pptx
    # (app/services/slide_deck.py). It pulls lxml, which is for OOXML only - the HTML rule in
    # CLAUDE.md still stands: html_dom.py stays on stdlib html.parser.
    "python-pptx>=1.0",
    # Text out of an uploaded skill or framework file (app/services/document_text.py).
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # tests/test_design_md.py parses the DESIGN.md front matter to prove it is valid YAML.
    # The generator hand-writes that block (see app/services/design_md.py), so nothing in the
    # runtime needs a YAML library - only the test that checks the hand-writing is correct.
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
